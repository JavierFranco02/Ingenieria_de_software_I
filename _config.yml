title: "ChipeSoft — Trabajo Práctico Integrador"
description: "Análisis y diseño de ChipeSoft, desarrollado para la dueña de Chiperia la Caraguateña."
lang: es

# Dirección del sitio publicado (necesaria para que los enlaces y el CSS
# funcionen en un sitio de proyecto como este).
url: "https://javierfranco02.github.io"
baseurl: "/Ingenieria_de_software_I/"

plugins:
  - jekyll-relative-links
  - jekyll-optional-front-matter

relative_links:
  enabled: true
  collections: false

# Aplica la plantilla a todos los .md (incluidos los ejercitarios)
defaults:
  - scope:
      path: ""
    values:
      layout: default

exclude:
  - README.md
  - CONTRIBUTING.md

# Ya no usamos ningún tema (antes: theme: jekyll-theme-cayman).
# El aspecto sale de _layouts/default.html y assets/css/estilos.css.
